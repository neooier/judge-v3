name: Docker NOI Linux 2.0 acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build pinned judge and NOI rootfs
        run: docker buildx build --load --platform linux/amd64 -t judge-noi:ci .
      - name: Verify toolchain without additional capabilities
        run: docker run --rm judge-noi:ci verify-toolchain
      - name: Compile, run and test cgroup v2 in Docker
        run: |
          docker run --rm --cgroupns=private --cap-add=SYS_ADMIN --cap-add=SYS_RESOURCE \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            judge-noi:ci verify-sandbox
