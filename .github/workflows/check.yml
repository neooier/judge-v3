name: Check judge
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 10
      - run: sudo apt-get update && sudo apt-get install -y python3 build-essential libfmt-dev
      - run: npm install -g yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
        env:
          PYTHON: /usr/bin/python3
      - run: yarn build
      - name: Load pinned native sandbox
        run: node -e "require('simple-sandbox')"
